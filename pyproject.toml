[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogwatch"
version = "1.0.0"
description = "Export any Shopify/WooCommerce catalog to CSV and report SKU-level price and stock changes."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
catalogwatch = "catalogwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
