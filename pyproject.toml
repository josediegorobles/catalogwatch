[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogwatch"
version = "1.0.0"
description = "Export any Shopify/WooCommerce catalog to CSV and report SKU-level price and stock changes."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15,<0.16"]

[project.scripts]
catalogwatch = "catalogwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

# Explicit rule set so a new ruff release cannot turn the build red on its own defaults.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
